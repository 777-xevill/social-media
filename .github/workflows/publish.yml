# Posts whatever is due. Your computer can be off — this is what keeps everything going.
# GitHub's cron is best-effort: on this repo it fired only every 4-8 hours, so posts
# went out hours late. Each run therefore stays alive ~5h40m and checks every 5 minutes;
# the cron only has to (re)start it, and the next run queues up behind the current one.
name: Publish

on:
  schedule:
    - cron: "7,37 * * * *"   # off the hour: GitHub delays jobs at :00
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Only show what would be posted"
        type: boolean
        default: false

permissions:
  contents: write   # save state/ (what was posted)
  issues: write     # email you about failures
  actions: write    # keep scheduled workflows enabled

concurrency:
  group: social-autopilot
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt

      - name: Post due content
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TOKEN_STORE_KEY: ${{ secrets.TOKEN_STORE_KEY }}
          FACEBOOK_PAGE_ID: ${{ secrets.FACEBOOK_PAGE_ID }}
          FACEBOOK_PAGE_TOKEN: ${{ secrets.FACEBOOK_PAGE_TOKEN }}
          INSTAGRAM_USER_ID: ${{ secrets.INSTAGRAM_USER_ID }}
          THREADS_USER_ID: ${{ secrets.THREADS_USER_ID }}
          THREADS_ACCESS_TOKEN: ${{ secrets.THREADS_ACCESS_TOKEN }}
          YOUTUBE_CLIENT_ID: ${{ secrets.YOUTUBE_CLIENT_ID }}
          YOUTUBE_CLIENT_SECRET: ${{ secrets.YOUTUBE_CLIENT_SECRET }}
          YOUTUBE_REFRESH_TOKEN: ${{ secrets.YOUTUBE_REFRESH_TOKEN }}
          LINKEDIN_CLIENT_ID: ${{ secrets.LINKEDIN_CLIENT_ID }}
          LINKEDIN_CLIENT_SECRET: ${{ secrets.LINKEDIN_CLIENT_SECRET }}
          LINKEDIN_ACCESS_TOKEN: ${{ secrets.LINKEDIN_ACCESS_TOKEN }}
          LINKEDIN_PERSON_URN: ${{ secrets.LINKEDIN_PERSON_URN }}
          PINTEREST_APP_ID: ${{ secrets.PINTEREST_APP_ID }}
          PINTEREST_APP_SECRET: ${{ secrets.PINTEREST_APP_SECRET }}
          PINTEREST_REFRESH_TOKEN: ${{ secrets.PINTEREST_REFRESH_TOKEN }}
          PINTEREST_BOARD_ID: ${{ secrets.PINTEREST_BOARD_ID }}
          BUFFER_API_KEY: ${{ secrets.BUFFER_API_KEY }}
          BUFFER_CHANNEL_X: ${{ secrets.BUFFER_CHANNEL_X }}
          BUFFER_CHANNEL_TIKTOK: ${{ secrets.BUFFER_CHANNEL_TIKTOK }}
          BUFFER_CHANNEL_YOUTUBE: ${{ secrets.BUFFER_CHANNEL_YOUTUBE }}
          BUFFER_CHANNEL_PINTEREST: ${{ secrets.BUFFER_CHANNEL_PINTEREST }}
          BUFFER_CHANNEL_LINKEDIN: ${{ secrets.BUFFER_CHANNEL_LINKEDIN }}
          BUFFER_CHANNEL_THREADS: ${{ secrets.BUFFER_CHANNEL_THREADS }}
          BUFFER_CHANNEL_INSTAGRAM: ${{ secrets.BUFFER_CHANNEL_INSTAGRAM }}
          BUFFER_CHANNEL_FACEBOOK: ${{ secrets.BUFFER_CHANNEL_FACEBOOK }}
          REDDIT_CLIENT_ID: ${{ secrets.REDDIT_CLIENT_ID }}
          REDDIT_CLIENT_SECRET: ${{ secrets.REDDIT_CLIENT_SECRET }}
          REDDIT_USERNAME: ${{ secrets.REDDIT_USERNAME }}
          REDDIT_PASSWORD: ${{ secrets.REDDIT_PASSWORD }}
          DRY_RUN: ${{ inputs.dry_run }}
        run: |
          git config user.name "social-autopilot[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          save_state() {
            git add state/
            git diff --cached --quiet && return 0
            git commit -q -m "chore: publishing state [skip ci]"
            for i in 1 2 3; do git pull --rebase -q && git push -q && return 0; sleep 5; done
            return 1
          }
          if [ "$DRY_RUN" = "true" ]; then python -m bot run --dry-run; exit $?; fi
          end=$((SECONDS + 20400))   # keep going for 5h40m, then let the next queued run take over
          status=0
          while true; do
            python -m bot run || status=$?
            save_state || status=$?
            [ "$SECONDS" -ge "$end" ] && break
            sleep 300
            git pull --rebase -q || true   # pick up posts added since this run started
          done
          exit $status
