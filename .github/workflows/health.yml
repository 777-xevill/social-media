# Weekly: checks every connected account, refreshes tokens, warns when the queue
# runs low or a token is about to expire (as a GitHub issue = email to you),
# and keeps the scheduled workflows from being paused by GitHub.
name: Health check

on:
  schedule:
    - cron: "17 3 * * 1"   # Mondays 03:17 UTC
  workflow_dispatch:

permissions:
  contents: write
  issues: write
  actions: write

concurrency:
  group: social-autopilot
  cancel-in-progress: false

jobs:
  health:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt

      - name: Check accounts
        env:
          BOT_SECRETS_JSON: ${{ toJSON(secrets) }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python -m bot health

      - name: Save state
        if: always()
        run: |
          git config user.name "social-autopilot[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add state/
          git diff --cached --quiet && exit 0
          git commit -m "chore: weekly health check [skip ci]"
          for i in 1 2 3; do git pull --rebase && git push && exit 0; sleep 5; done
          exit 1
